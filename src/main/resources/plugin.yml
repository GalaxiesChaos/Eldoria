name: EldoriaBase
description: $description
version: '${version}'

main: me.chaos.eldoriaBase.Main
paperPluginLoader: me.chaos.eldoriaBase.MainLoader
api-version: '26.3'
load: POSTWORLD

authors: [ Chaos ]

soft-depend:
  - "Nexo"

depend:
  - "Multiverse-Core"

permissions:
  eldoria.warp.admin:
    description: "Allows creating public warps"
    default: op
  eldoria.enchant.give:
    description: "Allows /enchantgive (admin/testing)"
    default: op
  eldoria.forge.admin:
    description: "Allows /forge admin (slot management)"
    default: op
  eldoria.npc.admin:
    description: "Allows /npc (spawn/remove/list/reload) - NPC admin"
    default: op
  eldoria.item.admin:
    description: "Allows /eitem (give/list/upgrade of custom items)"
    default: op
  eldoria.farmwelt:
    description: "Allows /farmwelt"
    default: true
  eldoria.plotwelt:
    description: "Allows /plotwelt"
    default: true
  eldoria.spawn:
    description: "Allows /spawn"
    default: true
  eldoria.ec:
    description: "Allows /ec (own ender chest)"
    default: true
  eldoria.ec.others:
    description: "Allows /ec <player> (other players' ender chests)"
    default: op
  eldoria.randomtp:
    description: "Allows /rtp"
    default: true
  eldoria.randomtp.bypass:
    description: "Bypasses the /rtp cooldown"
    default: op
  eldoria.jewels:
    description: "Allows /juwelen (see own balance)"
    default: true
  eldoria.jewels.admin:
    description: "Allows /juwelen give|take|set"
    default: op
  eldoria.rules:
    description: "Allows /regelwerk (open the rules book)"
    default: true
  eldoria.rules.admin:
    description: "Allows /regelwerk npc|remove"
    default: op

commands:
  warp:
    description: "Manage player warps (usage: /warp <to|set|addPublic> <id>)"
    usage: /warp <to|set|addPublic> <id>

  bank:
    description: Bank commands
    usage: /bank

  quest:
    description: Quest Menü öffnen
    usage: /quest

  enchantgive:
    description: "Admin: Gibt ein Verzauberungsbuch (Testing, bis Rezepte/Drops existieren)"
    usage: /enchantgive <enchant> <level>
    permission: eldoria.enchant.give

  eitem:
    description: "Admin: Custom-Items geben/listen/verbessern"
    usage: /eitem <give|list|upgrade>
    permission: eldoria.item.admin
  npc:
    description: "Admin: NPCs spawnen/entfernen/verwalten (usage: /npc <spawn|remove|list|reload> [id|all])"
    usage: /npc <spawn|remove|list|reload> [id|all]
    permission: eldoria.npc.admin
  farmwelt:
    description: "Teleport zur Farmwelt"
    usage: /farmwelt
    permission: eldoria.farmwelt
  plotwelt:
    description: "Teleport zur Plotwelt"
    usage: /plotwelt
    permission: eldoria.plotwelt
  spawn:
    description: "Teleport zum Spawn"
    usage: /spawn
    permission: eldoria.spawn
  ec:
    description: "Öffnet die Enderchest"
    usage: /ec [spieler]
    permission: eldoria.ec
  rtp:
    description: "Zufälliger Teleport in der Farmwelt"
    usage: /rtp
    permission: eldoria.randomtp
  juwelen:
    description: "Juwelen anzeigen/verwalten"
    usage: /juwelen [balance|give|take|set]
    permission: eldoria.jewels
  regelwerk:
    description: "Zeigt das Regelwerk"
    usage: /regelwerk [npc|remove]
    permission: eldoria.rules
