name: EldoriaBase
description: $description
version: '${version}'

main: me.chaos.eldoriaBase.Main
paperPluginLoader: me.chaos.eldoriaBase.MainLoader
api-version: '26.2'
load: POSTWORLD

authors: [ Chaos ]

depend:
  - "Multiverse-Core"

commands:
  warp:
    description: "Manage player warps (usage: /warp <to|set|addPublic> <id>)"
    usage: /warp <to|set|addPublic> <id>
    permission: eldoria.warp
    permission-message: You do not have permission to use /warp
  bank:
    description: Bank commands (EldoriaCash integration)
    usage: /bank
    permission: eldoria.bank
    permission-message: You do not have permission to use /bank

