name: EldoriaBase
description: $description
version: '${version}'

main: me.chaos.eldoriaBase.Main
paperPluginLoader: me.chaos.eldoriaBase.MainLoader
api-version: '26.3'
load: POSTWORLD

authors: [ Chaos ]

soft-depend:
  - "Nexo"

depend:
  - "Multiverse-Core"

permissions:
  eldoria.warp.admin:
    description: "Allows creating public warps"
    default: op
  eldoria.enchant.give:
    description: "Allows /enchantgive (admin/testing)"
    default: op
  eldoria.forge.admin:
    description: "Allows /forge admin (slot management)"
    default: op
  eldoria.npc.admin:
    description: "Allows /npc (spawn/remove/list/reload) - NPC admin"
    default: op
  eldoria.item.admin:
    description: "Allows /eitem (give/list/upgrade of custom items)"
    default: op

commands:
  warp:
    description: "Manage player warps (usage: /warp <to|set|addPublic> <id>)"
    usage: /warp <to|set|addPublic> <id>

  bank:
    description: Bank commands
    usage: /bank

  quest:
    description: Quest Menü öffnen
    usage: /quest

  enchantgive:
    description: "Admin: Gibt ein Verzauberungsbuch (Testing, bis Rezepte/Drops existieren)"
    usage: /enchantgive <enchant> <level>
    permission: eldoria.enchant.give

  eitem:
    description: "Admin: Custom-Items geben/listen/verbessern"
    usage: /eitem <give|list|upgrade>
    permission: eldoria.item.admin
  npc:
    description: "Admin: NPCs spawnen/entfernen/verwalten (usage: /npc <spawn|remove|list|reload> [id|all])"
    usage: /npc <spawn|remove|list|reload> [id|all]
    permission: eldoria.npc.admin
